server.port=8082
spring.application.name=device-registry

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5433/devices}
spring.datasource.username=${DATASOURCE_USER:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}

spring.sql.init.mode=always

monolith.url=${MONOLITH_URL:http://localhost:8080}
monolith.poll-interval-ms=${POLL_INTERVAL_MS:15000}
